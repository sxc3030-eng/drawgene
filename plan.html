<style>
:root{--bg:#15171c;--panel:#22252c;--line:#363a44;--txt:#e6e7ea;--acc:#3d8bff;--mut:#9aa0ab}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font:13px system-ui,sans-serif;overflow:hidden}
#top{height:46px;display:flex;align-items:center;gap:5px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
#top b{margin-right:6px;white-space:nowrap;font-size:14px}
#top .lia{background:linear-gradient(135deg,#ff6fbf,#7b4dff);border:0;color:#fff;font-weight:700;padding:6px 12px;border-radius:18px}#top .dgmb{font-weight:600}
button,select,input{font:inherit;color:var(--txt)}
button{background:#2f333c;border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer;white-space:nowrap}
button.on{background:var(--acc);border-color:var(--acc)}
select,input[type=text],input[type=number]{background:#1b1d23;border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100%}
#main{display:flex;height:calc(100% - 46px - 26px)}
#tools{width:60px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;padding:5px;overflow-y:auto}
#tools button{padding:5px 0;font-size:11px;line-height:1.1}
#tools button i{display:block;font-style:normal;font-size:18px}
#stage{flex:1;position:relative;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#ltabs{position:absolute;left:0;right:0;top:0;height:32px;display:flex;align-items:flex-end;gap:2px;padding:0 6px;background:#1b1d23;border-bottom:1px solid var(--acc);z-index:4;overflow-x:auto;overflow-y:hidden}
#ltabs .tb{display:flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--line);border-bottom:0;border-radius:7px 7px 0 0;background:#262a32;color:var(--mut);cursor:pointer;white-space:nowrap;user-select:none;font-size:12px}
#ltabs .tb.on{background:var(--acc);color:#fff;border-color:var(--acc)}#ltabs .tb i{font-style:normal;opacity:.85;padding:0 2px}#ltabs .tb.hid{text-decoration:line-through;opacity:.6}
#cv{top:32px!important;height:calc(100% - 32px)!important}
#entry{position:absolute;left:10px;bottom:44px;background:#000c;border:1px solid var(--acc);border-radius:6px;padding:4px 8px;font:14px monospace;display:none}
#help{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 300px);background:#000a;padding:4px 8px;border-radius:6px;color:var(--mut);font-size:12px;pointer-events:none;max-width:70%}
#side{width:300px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
#tabs{display:flex}#tabs button{flex:1;border-radius:0;border-width:0 0 2px 0;background:none}
#tabs button.on{border-color:var(--acc);color:#fff}
.pane{flex:1;overflow-y:auto;padding:10px;display:none}.pane.on{display:block}
h4{font-size:11px;text-transform:uppercase;color:var(--mut);margin:12px 0 6px}
.f{display:grid;grid-template-columns:1fr 1.2fr;gap:4px 8px;align-items:center;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:4px 3px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right}
td input{width:62px;padding:2px 4px;text-align:right;background:#1b1d23;border:1px solid var(--line);border-radius:4px}
.tot{font-size:15px;font-weight:600;margin-top:8px;text-align:right}
.note{color:var(--mut);font-size:11px;margin-top:6px;line-height:1.4}
#status{height:26px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 10px;font:12px monospace;color:var(--mut);overflow:hidden;white-space:nowrap}
@media(max-width:760px){#side{position:absolute;right:0;top:46px;bottom:26px;z-index:5;transform:translateX(100%);transition:.2s;width:88%}#side.open{transform:none}}
@media print{#top,#tools,#side,#status,#help,#entry{display:none!important}#main{height:100vh}}
</style>

<body>
<div id="top">
  <button id="aiB" class="lia" title="Lia, votre assistante (sans internet)">👩 Lia</button><b>📐 drawGene <small style="font-weight:400;opacity:.6;font-size:11px">v12</small></b>
  <select id="mode" style="width:auto"><option value="bat">🏠 Bâtiment</option><option value="mec">⚙️ Pièce mécanique</option></select>
  <select id="unit" style="width:auto"><option value="mm">mm</option><option value="m">m</option><option value="po">pi/po</option></select>
  <button id="undo" title="Annuler (Ctrl+Z)">↶</button><button id="redo" title="Rétablir (Ctrl+Y)">↷</button><button id="delSel" title="Supprimer la sélection (Suppr)">🗑</button>
  <button id="ortho" title="F8">Ortho</button><button id="snapB" class="on" title="F9">Aimant</button>
  <button id="fit">Ajuster</button><a href="modele3d.html"><button>🧊 3D</button></a>
  <span id="tbEnd"></span><button id="newB">📄 Nouveau</button><button id="saveB">💾 Enregistrer</button><button id="openB">📂 Ouvrir</button>
  <button id="photoB">📷 Photo de référence</button><button id="to3dB">⬆ Envoyer la pièce en 3D</button><button id="pngB">🖼 Exporter une image PNG</button><button id="dxfB">⬇ Exporter en DXF (AutoCAD)</button><button id="dxfI">⬆ Importer un DXF</button><button id="csvB">📊 Liste de matériaux (CSV)</button><button id="printB">🖨 Imprimer</button>
  <button id="winB">🪟 Fenêtres…</button><button id="panelB">◨ Panneau de droite</button>
  <input type="file" id="file" accept=".drawgene,.json,application/json" hidden><input type="file" id="photoF" accept="image/*" hidden><input type="file" id="dxfF" accept=".dxf" hidden>
</div>
<div id="main">
  <div id="tools"></div>
  <div id="stage"><div id="ltabs"></div><canvas id="cv"></canvas><div id="help"></div><div id="entry"></div></div>
  <div id="side">
    <div id="tabs"><button data-p="props" class="on">Propriétés</button><button data-p="mat">Matériaux</button><button data-p="cfg">Réglages</button></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');

// ---------- Données ----------
const DENS={acier:7850,inox:8000,alu:2700,laiton:8500,cuivre:8960,bois:600,pvc:1400,acrylique:1190};
const KGPRICE={acier:2,inox:6,alu:5,laiton:9,cuivre:12,bois:1.5,pvc:4,acrylique:6};
const WALLMAT={ossature:'Ossature bois',beton:'Béton coulé',bloc:'Blocs béton'};
const DEF_PRICES={bois_2x4:5.5,bois_2x6:9,gypse:18,isolant:8,peinture:15,beton:220,bloc:3.5,plancher:35,ceramique:45,plinthe:4,porte:250,fenetre:450,coupe:1.5};
let S={ents:[],mode:'bat',unit:'mm',prices:{...DEF_PRICES},kgprice:{...KGPRICE},
  cfg:{wallT:150,wallH:2440,wallMat:'ossature',stud:406,faces:2,ep:6,metal:'acier',ortho:false,snap:true,autoDim:true}};
let nid=1,sel=null,tool='select',pts=[],cur={x:0,y:0},entry='';
let view={x:0,y:0,s:.1};
let undoS=[],redoS=[];

// ---------- Unités ----------
function fmt(mm,dec){if(mm==null||isNaN(mm))return'';const u=S.unit;
  if(u=='m')return(mm/1000).toFixed(3)+' m';
  if(u=='po'){let i=mm/25.4,neg=i<0;i=Math.abs(i);const ft=Math.floor(i/12);let n=Math.round((i-ft*12)*16),w=Math.floor(n/16),f=n%16,d=16;
    while(f&&f%2==0){f/=2;d/=2}let s=(ft?ft+"' ":'')+w+(f?' '+f+'/'+d:'')+'"';if(w==12)s=(ft+1)+"' 0\"";return(neg?'-':'')+s}
  return(S.mode=='mec'||dec?(Math.round(mm*10)/10):Math.round(mm))+' mm'}
function fmtA(mm2){if(S.unit=='po')return(mm2/92903.04).toFixed(2)+' pi²';return S.mode=='mec'?(mm2/100).toFixed(2)+' cm²':(mm2/1e6).toFixed(2)+' m²'}
function parseLen(s){s=String(s).trim().replace(',','.');if(!s)return NaN;
  let m=s.match(/^(-?\d+(?:\.\d+)?)\s*'\s*(?:(\d+(?:\.\d+)?)\s*"?)?$/);if(m)return(+m[1]*12+(+m[2]||0))*25.4;
  m=s.match(/^(-?\d+(?:\.\d+)?)\s*(mm|cm|m|po|"|in)?$/);if(!m)return NaN;const v=+m[1],u=m[2];
  if(u=='mm')return v;if(u=='cm')return v*10;if(u=='m')return v*1000;if(u=='po'||u=='"'||u=='in')return v*25.4;
  return S.unit=='m'?v*1000:S.unit=='po'?v*25.4:v}

// ---------- Géométrie ----------
const dist=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y);
function segDist(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;let t=l?((p.x-a.x)*dx+(p.y-a.y)*dy)/l:0;t=Math.max(0,Math.min(1,t));return{d:Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy),t}}
function polyArea(p){let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a.x*b.y-b.x*a.y}return Math.abs(s/2)}
function polyPerim(p,closed=true){let s=0;for(let i=0;i<p.length-(closed?0:1);i++)s+=dist(p[i],p[(i+1)%p.length]);return s}
function inPoly(pt,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if((a.y>pt.y)!=(b.y>pt.y)&&pt.x<(b.x-a.x)*(pt.y-a.y)/(b.y-a.y)+a.x)c=!c}return c}
function centroid(p){let x=0,y=0;p.forEach(q=>{x+=q.x;y+=q.y});return{x:x/p.length,y:y/p.length}}
function rectPts(e){return[{x:e.a.x,y:e.a.y},{x:e.b.x,y:e.a.y},{x:e.b.x,y:e.b.y},{x:e.a.x,y:e.b.y}]}
function shapeArea(e){return e.type=='circle'?Math.PI*e.r*e.r:e.type=='rect'?Math.abs((e.b.x-e.a.x)*(e.b.y-e.a.y)):polyArea(e.pts)}
function shapePerim(e){return e.type=='circle'?2*Math.PI*e.r:e.type=='rect'?2*(Math.abs(e.b.x-e.a.x)+Math.abs(e.b.y-e.a.y)):polyPerim(e.pts)}
function shapeCenter(e){return e.type=='circle'?e.c:e.type=='rect'?{x:(e.a.x+e.b.x)/2,y:(e.a.y+e.b.y)/2}:centroid(e.pts)}
function shapeContains(e,p){if(e.type=='circle')return dist(e.c,p)<e.r;if(e.type=='rect')return p.x>Math.min(e.a.x,e.b.x)&&p.x<Math.max(e.a.x,e.b.x)&&p.y>Math.min(e.a.y,e.b.y)&&p.y<Math.max(e.a.y,e.b.y);return inPoly(p,e.pts)}
const isShape=e=>['rect','circle','poly'].includes(e.type);

// ---------- Outils ----------
const TOOLS=[
 ['select','👆','Sélect.','V','both'],['wall','🧱','Mur','W','bat'],['door','🚪','Porte','O','bat'],['window','🪟','Fenêtre','F','bat'],['room','🟦','Pièce','P','bat'],
 ['line','📏','Ligne','L','both'],['rect','⬜','Rect.','R','both'],['circle','⭕','Cercle','C','both'],['poly','🔷','Polygone','G','mec'],
 ['dim','↔️','Cote','D','both'],['text','🔤','Texte','T','both'],['measure','📐','Mesure','M','both'],['calib','🎯','Échelle','K','both'],['rectify','🔲','Redresser','Q','both'],['pan','✋','Vue','H','both']];
const HELP={select:'Clic droit : menu · Glisser dans le vide : sélection par rectangle · Ctrl+clic : ajouter · Clic sur une cote bleue : la modifier · Clic: sélectionner · glisser: déplacer · glisser une extrémité: étirer · Suppr: effacer',
 wall:'Clic début, clic fin (enchaîné). Tapez une longueur + Entrée. Échap/clic droit: terminer',
 door:'Clic sur un mur pour placer une porte',window:'Clic sur un mur pour placer une fenêtre',
 room:'Cliquez les coins de la pièce, Entrée ou clic sur le 1er point pour fermer',
 line:'Clic début, clic fin (enchaîné). Longueur au clavier + Entrée',rect:'Clic coin, clic coin opposé. Tapez « largeur,hauteur » + Entrée',
 circle:'Clic centre, clic rayon. Tapez un diamètre + Entrée. Un cercle dans une pièce = trou',
 poly:'Cliquez les sommets, Entrée ou 1er point pour fermer',dim:'Clic point A, clic point B, clic position de la cote',
 text:'Clic pour placer un texte',measure:'Clic A, clic B : affiche la distance',calib:'Photo : cliquez 2 points d\'une distance connue, puis entrez la vraie distance',rectify:'Photo prise de biais : cliquez les 4 coins d\'une feuille/rectangle connu (haut-gauche, haut-droit, bas-droit, bas-gauche)',pan:'Glisser pour déplacer la vue · molette/pincer: zoom'};
function buildTools(){const t=$('tools');t.innerHTML='';TOOLS.forEach(([id,ic,lb,k,m])=>{if(m!='both'&&m!=S.mode)return;
  const b=document.createElement('button');b.innerHTML=`<i>${ic}</i>${lb}`;b.title=lb+' ('+k+')';b.dataset.t=id;b.onclick=()=>setTool(id);t.append(b)});setTool(tool)}
function setTool(t){if(!TOOLS.find(x=>x[0]==t&&(x[4]=='both'||x[4]==S.mode)))t='select';tool=t;pts=[];entry='';showEntry();
  document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));$('help').textContent=HELP[t];cv.style.cursor=t=='pan'?'grab':t=='select'?'default':'crosshair';draw()}

// ---------- Calques (onglets) ----------
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const layerOf=id=>(S.layers||[]).find(l=>l.id==id);
const layerVis=id=>{const l=layerOf(id);return!l||l.vis!==false};
const layerLock=id=>{const l=layerOf(id);return!!(l&&l.lock)};
function fixLayers(){if(!S.layers||!S.layers.length)S.layers=[{id:1,name:'Calque 1',vis:true,lock:false}];if(!layerOf(S.curLayer))S.curLayer=S.layers[0].id;
  S.ents.forEach(e=>{if(!layerOf(e.layer))e.layer=S.layers[0].id});linkFreeDims();if(S.dimOthers==null)S.dimOthers=true}
function renderTabs(){const T=$('ltabs');T.innerHTML='';
  S.layers.forEach(l=>{const b=document.createElement('div');b.className='tb'+(l.id==S.curLayer?' on':'')+(l.vis===false?' hid':'');b.title='Clic : travailler sur ce calque · Double-clic : renommer';
    const n=S.ents.filter(e=>e.layer==l.id).length;b.innerHTML=`<span></span><small style="opacity:.7">${n}</small>`;b.querySelector('span').textContent=l.name;
    if(l.id==S.curLayer){const eye=document.createElement('i');eye.textContent=l.vis===false?'🚫':'👁';eye.title='Afficher / masquer';eye.onclick=ev=>{ev.stopPropagation();l.vis=l.vis===false;renderTabs();draw();save()};
      const lk=document.createElement('i');lk.textContent=l.lock?'🔒':'🔓';lk.title='Verrouiller (empêche de sélectionner)';lk.onclick=ev=>{ev.stopPropagation();l.lock=!l.lock;sel=null;renderTabs();renderProps();draw();save()};
      b.append(eye,lk);if(S.layers.length>1){const x=document.createElement('i');x.textContent='✕';x.title='Supprimer ce calque';x.onclick=ev=>{ev.stopPropagation();
        if(!confirm('Supprimer le calque « '+l.name+' » et ses '+n+' élément(s) ?'))return;snap0();S.ents=S.ents.filter(e=>e.layer!=l.id);S.layers=S.layers.filter(z=>z!==l);S.curLayer=S.layers[0].id;sel=null;renderTabs();changed()};b.append(x)}}
    b.onclick=()=>{S.curLayer=l.id;sel=null;renderTabs();renderProps();draw();save()};
    b.ondblclick=()=>{const v=prompt('Nom du calque :',l.name);if(v){l.name=v.trim()||l.name;renderTabs();save()}};T.append(b)});
  const add=document.createElement('div');add.className='tb';add.textContent='＋ Calque';add.title='Nouveau calque';
  add.onclick=()=>{const id=Math.max(0,...S.layers.map(l=>l.id))+1,sug=S.mode=='bat'?['Murs','Électricité','Plomberie','Mobilier','Terrain','Cotes']:['Pièce','Trous','Cotes','Assemblage','Construction'];
    const v=prompt('Nom du nouveau calque :',sug[(S.layers.length-1)%sug.length]||'Calque '+id);if(!v)return;S.layers.push({id,name:v.trim(),vis:true,lock:false});S.curLayer=id;renderTabs();draw();save()};T.append(add);
  const dim=document.createElement('div');dim.className='tb';dim.style.marginLeft='auto';dim.textContent=S.dimOthers?'◐ Autres atténués':'● Tous pleins';dim.title='Atténuer les autres calques';
  dim.onclick=()=>{S.dimOthers=!S.dimOthers;renderTabs();draw();save()};T.append(dim)}

// ---------- Historique ----------
function snap0(){undoS.push(JSON.stringify(S.ents));if(undoS.length>100)undoS.shift();redoS=[]}
function undo(){if(!undoS.length)return;redoS.push(JSON.stringify(S.ents));S.ents=JSON.parse(undoS.pop());sel=null;msel=[];changed()}
function redo(){if(!redoS.length)return;undoS.push(JSON.stringify(S.ents));S.ents=JSON.parse(redoS.pop());sel=null;msel=[];changed()}
function add(e){e.id=nid++;if(e.layer==null)e.layer=S.curLayer;S.ents.push(e);return e}
const byId=id=>S.ents.find(e=>e.id==id);
// ---------- Cotes associatives : accrochées aux points des pièces ----------
function refCands(e){const L=[];if(e.type=='dim'||e.type=='text')return L;
  ['a','b','c','p'].forEach(k=>{if(e[k])L.push([k,()=>e[k]])});if(e.pts)e.pts.forEach((q,i)=>L.push(['pts.'+i,()=>e.pts[i]]));
  if(e.type=='rect')[0,1,2,3].forEach(i=>L.push(['r.'+i,()=>rectPts(e)[i]]));
  if(e.type=='wall'||e.type=='line')L.push(['m',()=>({x:(e.a.x+e.b.x)/2,y:(e.a.y+e.b.y)/2})]);
  if(e.type=='circle')[[1,0],[0,1],[-1,0],[0,-1]].forEach(([dx,dy],i)=>L.push(['q.'+i,()=>({x:e.c.x+dx*e.r,y:e.c.y+dy*e.r})]));return L}
function findRef(pt,skip,tol){tol=tol??Math.max(.01,1/view.s);for(const e of S.ents){if(e===skip)continue;for(const [k,g] of refCands(e)){const q=g();if(q&&dist(q,pt)<tol)return{id:e.id,k}}}return null}
function linkFreeDims(){S.ents.forEach(d=>{if(d.type!='dim')return;if(!d.aRef){const r=findRef(d.a,d,.5);if(r)d.aRef=r}if(!d.bRef){const r=findRef(d.b,d,.5);if(r)d.bRef=r}})}
function resolveRef(r){const e=byId(r.id);if(!e)return null;const c=refCands(e).find(x=>x[0]==r.k);return c?c[1]():null}
function updateDims(remove){let gone=false;S.ents.forEach(d=>{if(d.type!='dim'||(!d.aRef&&!d.bRef))return;const na=d.aRef?resolveRef(d.aRef):d.a,nb=d.bRef?resolveRef(d.bRef):d.b;
    if(!na||!nb){if(remove){d._gone=true;gone=true}return}
    const L=dist(d.a,d.b)||1,nx=-(d.b.y-d.a.y)/L,ny=(d.b.x-d.a.x)/L,off=(d.o.x-d.a.x)*nx+(d.o.y-d.a.y)*ny,t=((d.o.x-d.a.x)*(d.b.x-d.a.x)+(d.o.y-d.a.y)*(d.b.y-d.a.y))/(L*L);
    d.a={x:na.x,y:na.y};d.b={x:nb.x,y:nb.y};const L2=dist(d.a,d.b)||1,mx=-(d.b.y-d.a.y)/L2,my=(d.b.x-d.a.x)/L2;
    d.o={x:d.a.x+(d.b.x-d.a.x)*t+mx*off,y:d.a.y+(d.b.y-d.a.y)*t+my*off}});
  if(gone)S.ents=S.ents.filter(d=>!d._gone)}
function changed(){updateDims(true);S.ents.forEach(e=>{if(e.id>=nid)nid=e.id+1});if(S.layers)renderTabs();draw();renderProps();renderMat();save()}
function save(){try{localStorage.setItem('planpro',JSON.stringify(S))}catch(e){}}

// ---------- Vue ----------
const W2S=p=>({x:p.x*view.s+view.x,y:p.y*view.s+view.y});
const S2W=p=>({x:(p.x-view.x)/view.s,y:(p.y-view.y)/view.s});
function resize(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}

let snapInfo=null;

  S.ents.forEach(e=>{if(e.type=='text'||!layerVis(e.layer))return;allPts(e).forEach(p=>test(p,e.type=='circle'?'centre':'extrémité'));
    if(e.type=='wall'||e.type=='line'){test({x:(e.a.x+e.b.x)/2,y:(e.a.y+e.b.y)/2},'milieu')}
    if(e.type=='rect')rectPts(e).forEach(p=>test(p,'coin'));
    if(e.type=='circle')[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>test({x:e.c.x+dx*e.r,y:e.c.y+dy*e.r},'quadrant'))});
  pts.forEach(p=>test(p,'point'));
  if(best)return best;

  if(base&&(S.cfg.ortho!=shiftDown)){if(Math.abs(p.x-base.x)>Math.abs(p.y-base.y))p.y=base.y;else p.x=base.x}
  if(S.cfg.snap){const g=gridStep();if(base&&(S.cfg.ortho!=shiftDown)){if(p.y==base.y)p.x=base.x+Math.round((p.x-base.x)/g)*g;else p.y=base.y+Math.round((p.y-base.y)/g)*g}

  return p}

function hit(w){const tol=8/view.s;let best=null,bd=1/0;const HE=S.ents.filter(e=>e.layer==S.curLayer&&layerVis(e.layer)&&!layerLock(e.layer));
  for(const e of [...HE].reverse()){let d=1/0;
    if(e.type=='wall')d=segDist(w,e.a,e.b).d-e.t/2;else if(e.type=='line')d=segDist(w,e.a,e.b).d;else if(e.type=='dim'){const L=dist(e.a,e.b)||1,nx=-(e.b.y-e.a.y)/L,ny=(e.b.x-e.a.x)/L,o=(e.o.x-e.a.x)*nx+(e.o.y-e.a.y)*ny;d=Math.min(segDist(w,{x:e.a.x+nx*o,y:e.a.y+ny*o},{x:e.b.x+nx*o,y:e.b.y+ny*o}).d,segDist(w,e.a,e.b).d+tol*.5)}
    else if(e.type=='door'||e.type=='window')d=dist(w,e.p)-e.w/2;else if(e.type=='text')d=dist(w,e.p)-200;
    else if(e.type=='circle')d=Math.abs(dist(w,e.c)-e.r);else if(e.type=='rect'||e.type=='poly'){const p=e.type=='rect'?rectPts(e):e.pts;d=1/0;for(let i=0;i<p.length;i++)d=Math.min(d,segDist(w,p[i],p[(i+1)%p.length]).d)}
    else if(e.type=='room')d=inPoly(w,e.pts)?tol*.9:1/0;
    if(d<tol&&d<bd){bd=d;best=e}}
  if(!best)for(const e of [...HE].reverse())if(isShape(e)&&shapeContains(e,w))return e;
  return best}
function translate(e,dx,dy){['a','b','c','p','o'].forEach(k=>{if(e[k]){e[k].x+=dx;e[k].y+=dy}});if(e.pts)e.pts.forEach(p=>{p.x+=dx;p.y+=dy})}
function attachOpenings(){S.ents.forEach(o=>{if(o.type!='door'&&o.type!='window')return;const nw=nearestWall(o.p);if(nw){const e=nw.e;o.p={x:e.a.x+(e.b.x-e.a.x)*nw.t,y:e.a.y+(e.b.y-e.a.y)*nw.t};o.ang=Math.atan2(e.b.y-e.a.y,e.b.x-e.a.x);o.t=e.t}})}

function evPt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pointers.set(e.pointerId,evPt(e));
  if(pointers.size==2){const [a,b]=[...pointers.values()];pinch={d:dist(a,b),m:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},v:{...view}};drag=null;return}
  if(e.button==2){rpan={sp:evPt(e),v:{...view},moved:false};return}const sp=evPt(e),w=S2W(sp);
  if(tool=='pan'||e.button==1){panS={sp,v:{...view}};cv.style.cursor='grabbing';return}
  if(e.pointerType!='mouse'){hover=true;cur=snapPoint(w,pts[pts.length-1])}
  if(tool=='select'||!pts.length&&e.detail>1){const dh=dimAt(sp);if(dh){e.preventDefault();setTimeout(()=>openDimEd(dh),0);return}}
  if(tool=='select'){const se=byId(sel);
    if(se&&se.type!='room'){const ps=allPts(se);for(const p of ps)if(dist(W2S(p),sp)<10){snap0();drag={kind:'pt',p,moved:false};return}}
    const h=hit(w),add2=e.ctrlKey||e.metaKey||e.shiftKey;
    if(add2&&h){if(!msel.length&&sel!=null&&sel!=h.id)msel=[sel];const i=msel.indexOf(h.id);if(i>=0)msel.splice(i,1);else msel.push(h.id);sel=msel.length==1?msel[0]:null;if(msel.length==1)msel=[];renderProps();draw();return}
    if(h&&isSel(h)&&msel.length){snap0();drag={kind:'multi',last:snapPoint(w),moved:false};draw();return}
    msel=[];sel=h?h.id:null;renderProps();if(h){snap0();drag={kind:'move',e:h,last:snapPoint(w),moved:false}}else if(e.pointerType=='touch'){panS={sp,v:{...view}}}else{boxS={a:sp,b:sp,add:add2}}draw();return}
  click(cur)});
cv.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId))pointers.set(e.pointerId,evPt(e));
  if(pinch&&pointers.size==2){const [a,b]=[...pointers.values()],m={x:(a.x+b.x)/2,y:(a.y+b.y)/2},k=dist(a,b)/pinch.d,ns=pinch.v.s*k;
    view.s=ns;view.x=m.x-(pinch.m.x-pinch.v.x)*k;view.y=m.y-(pinch.m.y-pinch.v.y)*k;draw();return}
  const sp=evPt(e),w=S2W(sp);hover=true;
  if(rpan){if(dist(sp,rpan.sp)>4)rpan.moved=true;if(rpan.moved){view.x=rpan.v.x+sp.x-rpan.sp.x;view.y=rpan.v.y+sp.y-rpan.sp.y;cv.style.cursor='grabbing';draw()}return}
  if(boxS){boxS.b=sp;draw();return}
  if(panS){view.x=panS.v.x+sp.x-panS.sp.x;view.y=panS.v.y+sp.y-panS.sp.y;draw();return}
  if(drag){if(drag.kind=='pt'){const p=snapPoint(w);drag.p.x=p.x;drag.p.y=p.y}
    else if(drag.kind=='multi'){const p=snapPoint(w),dx=p.x-drag.last.x,dy=p.y-drag.last.y;selEnts().forEach(x=>translate(x,dx,dy));drag.last=p}
    else{const p=snapPoint(w),dx=p.x-drag.last.x,dy=p.y-drag.last.y;(drag.e.grp?S.ents.filter(x=>x.grp==drag.e.grp):[drag.e]).forEach(x=>translate(x,dx,dy));drag.last=p}
    drag.moved=true;attachOpenings();draw();return}
  if(tool=='select'&&!drag&&!panS)cv.style.cursor=dimAt(sp)?'text':'default';
  cur=tool=='select'||tool=='pan'||tool=='calib'||tool=='rectify'?(snapInfo=null,w):snapPoint(w,pts[pts.length-1]);
  $('sXY').textContent='X '+fmt(cur.x)+'  Y '+fmt(-cur.y);$('sInfo').textContent=snapInfo&&tool!='select'?'⌖ '+snapInfo:'';draw()});
const up=e=>{pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;
  if(rpan&&e.button==2){const r=rpan;rpan=null;cv.style.cursor=tool=='select'?'default':'crosshair';if(!r.moved)ctxMenu(e,r.sp);return}
  if(boxS){const B=boxS;boxS=null;const x0=Math.min(B.a.x,B.b.x),x1=Math.max(B.a.x,B.b.x),y0=Math.min(B.a.y,B.b.y),y1=Math.max(B.a.y,B.b.y),cross=B.b.x<B.a.x;
    if(x1-x0>4||y1-y0>4){const inR=q=>{const s=W2S(q);return s.x>=x0&&s.x<=x1&&s.y>=y0&&s.y<=y1};
      const found=S.ents.filter(e=>e.layer==S.curLayer&&layerVis(e.layer)&&!layerLock(e.layer)).filter(e=>{let P=e.type=='rect'?rectPts(e):allPts(e);if(e.type=='circle')P=[{x:e.c.x-e.r,y:e.c.y},{x:e.c.x+e.r,y:e.c.y},{x:e.c.x,y:e.c.y-e.r},{x:e.c.x,y:e.c.y+e.r}];if(!P.length)return false;return cross?P.some(inR):P.every(inR)}).map(e=>e.id);
      msel=B.add?[...new Set([...msel,...(sel!=null?[sel]:[]),...found])]:found;sel=msel.length==1?msel[0]:null;if(msel.length==1)msel=[];
      if(msel.length)alertBox(msel.length+' élément(s) sélectionné(s) — Suppr pour effacer, glisser pour déplacer');}
    renderProps();draw();return}if(panS){panS=null;cv.style.cursor=tool=='pan'?'grab':tool=='select'?'default':'crosshair'}
  if(drag){if(!drag.moved)undoS.pop();drag=null;changed()}if(e.pointerType!='mouse')hover=false};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('pointerleave',()=>{hover=false;draw()});
cv.addEventListener('dblclick',()=>finish());
cv.addEventListener('wheel',e=>{e.preventDefault();const sp=evPt(e),k=Math.exp(-e.deltaY*.0015),ns=Math.min(500,Math.max(.002,view.s*k));
  view.x=sp.x-(sp.x-view.x)*ns/view.s;view.y=sp.y-(sp.y-view.y)*ns/view.s;view.s=ns;draw()},{passive:false});

function click(p){const P=pts,last=P[P.length-1];
  switch(tool){
  case'wall':case'line':if(last&&dist(last,p)>0.01){snap0();if(tool=='wall')add({type:'wall',a:{...last},b:{...p},t:S.cfg.wallT,h:S.cfg.wallH,mat:S.cfg.wallMat});else add({type:'line',a:{...last},b:{...p}});pts=[p];changed()}else if(!last)pts=[p];break;
  case'measure':if(last){$('sInfo').textContent='Distance: '+fmt(dist(last,p))+'  ΔX '+fmt(p.x-last.x)+'  ΔY '+fmt(last.y-p.y)+'  Angle '+angDeg(last,p)+'°';alertBox('📐 '+fmt(dist(last,p))+'  ('+angDeg(last,p)+'°)');pts=[]}else pts=[p];break;
  case'rect':if(last){if(Math.abs(p.x-last.x)>0&&Math.abs(p.y-last.y)>0){snap0();add({type:'rect',a:{...last},b:{...p},role:defRole(shapeCenterRP(last,p))});changed()}pts=[]}else pts=[p];break;
  case'circle':if(last){const r=dist(last,p);if(r>0){snap0();add({type:'circle',c:{...last},r,role:defRole(last)});changed()}pts=[]}else pts=[p];break;
  case'room':case'poly':if(P.length>2&&dist(W2S(P[0]),W2S(p))<12){finish();break}pts.push(p);break;
  case'dim':pts.push(p);if(pts.length==3){snap0();const d=add({type:'dim',a:{...pts[0]},b:{...pts[1]},o:{...pts[2]}});const ra=findRef(pts[0],d),rb=findRef(pts[1],d);if(ra)d.aRef=ra;if(rb)d.bRef=rb;pts=[];changed();if(ra||rb)alertBox('🔗 Cote liée à la pièce : elle suivra ses changements')}break;
  case'door':case'window':{const nw=nearestWall(p);if(!nw){alertBox('Cliquez sur un mur');break}snap0();const e=nw.e;
    add({type:tool,p:{x:e.a.x+(e.b.x-e.a.x)*nw.t,y:e.a.y+(e.b.y-e.a.y)*nw.t},ang:Math.atan2(e.b.y-e.a.y,e.b.x-e.a.x),t:e.t,w:tool=='door'?(S.unit=='po'?812.8:810):(S.unit=='po'?914.4:900),h:tool=='door'?2032:1200,flip:false});changed();break}
  case'calib':{if(!S.bg){alertBox('Chargez d\'abord une photo (📷)');break}pts.push(p);if(pts.length==2){const d=dist(pts[0],pts[1]),v=parseLen(prompt('Vraie distance entre les 2 points ('+S.unit+') :','100')||'');
    if(v>0&&d>0){const k=v/d,o=pts[0];S.bg.x=o.x+(S.bg.x-o.x)*k;S.bg.y=o.y+(S.bg.y-o.y)*k;S.bg.w*=k;saveBg();alertBox('✔ Photo à l\'échelle');fit()}pts=[]}break}
  case'rectify':{if(!S.bg){alertBox('Chargez d\'abord une photo (📷)');break}pts.push(p);if(pts.length==4){const q=pts.slice();pts=[];const a=(prompt('Dimensions réelles du rectangle cliqué « largeur,hauteur » (feuille A4 = 297,210 ou 210,297) :','297,210')||'').split(/[,x×]/).map(parseLen);
    if(a[0]>0&&a[1]>0)rectifyPhoto(q,a[0],a[1])}break}
  case'text':{const s=prompt('Texte :');if(s){snap0();add({type:'text',p:{...p},s,size:S.mode=='bat'?250:5});changed()}break}}
  draw()}
const shapeCenterRP=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
function defRole(c){if(S.mode!='mec')return'trait';return S.ents.some(e=>isShape(e)&&e.role=='contour'&&shapeContains(e,c))?'trou':'contour'}
function finish(){if((tool=='room'||tool=='poly')&&pts.length>2){snap0();if(tool=='room'){const n=prompt('Nom de la pièce :','Pièce '+(S.ents.filter(e=>e.type=='room').length+1));add({type:'room',pts:pts.map(p=>({...p})),name:n||'Pièce',floor:'plancher'})}
  else add({type:'poly',pts:pts.map(p=>({...p})),closed:true,role:defRole(centroid(pts))});changed()}pts=[];entry='';showEntry();draw()}
function alertBox(t){const h=$('help');h.textContent=t;h.style.color='#3dff8b';clearTimeout(alertBox.t);alertBox.t=setTimeout(()=>{h.style.color='';h.textContent=HELP[tool]},2500)}

// saisie numérique
function showEntry(){const b=$('entry');b.style.display=entry?'block':'none';b.textContent='⌨ '+entry+'▏'}
function applyEntry(){const P=pts,last=P[P.length-1];if(!last)return;let s=entry;entry='';showEntry();
  if(tool=='rect'){const [a,b]=s.split(/[,x×*]/).map(parseLen);if(isNaN(a))return;const h=isNaN(b)?a:b;const sx=cur.x>=last.x?1:-1,sy=cur.y>=last.y?1:-1;click({x:last.x+sx*a,y:last.y+sy*h});return}
  if(tool=='circle'){const d=parseLen(s);if(d>0){const r=d/2;snap0();add({type:'circle',c:{...last},r,role:defRole(last)});pts=[];changed()}return}
  let L=parseLen(s),ang=null;const m=s.match(/<\s*(-?\d+(?:\.\d+)?)/);if(m){L=parseLen(s.split('<')[0]);ang=-m[1]*Math.PI/180}
  if(isNaN(L))return;if(ang==null){const dx=cur.x-last.x,dy=cur.y-last.y;ang=Math.atan2(dy,dx);if(!dx&&!dy)ang=0}
  click({x:last.x+Math.cos(ang)*L,y:last.y+Math.sin(ang)*L})}

addEventListener('keydown',e=>{const tg=e.target.tagName;if(tg=='INPUT'||tg=='SELECT'||tg=='TEXTAREA')return;const k=e.key;
  if(k=='Shift'){shiftDown=true;return}
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()=='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()=='y'){e.preventDefault();redo();return}
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()=='s'){e.preventDefault();$('saveB').click();return}
  if(k=='F8'){e.preventDefault();toggle('ortho');return}if(k=='F9'){e.preventDefault();toggle('snap');return}
  if(pts.length&&/^[0-9.,'"<x\-]$/.test(k)){entry+=k;showEntry();e.preventDefault();return}
  if(k=='Backspace'&&entry){entry=entry.slice(0,-1);showEntry();e.preventDefault();return}
  if(k=='Enter'){entry?applyEntry():finish();return}
  if(k=='Escape'){if(entry){entry='';showEntry()}else if(pts.length)finish();else{sel=null;msel=[];setTool('select');renderProps();draw()}return}
  if((k=='Delete'||k=='Backspace')&&(sel!=null||msel.length)){e.preventDefault();deleteSel();return}
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()=='c'){e.preventDefault();copySel2();return}
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()=='x'){e.preventDefault();if(copySel2())deleteSel();return}
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()=='v'){e.preventDefault();paste2(hover?cur:null);return}
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()=='d'){e.preventDefault();if(copySel2())paste2(null);return}
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()=='a'){e.preventDefault();selectAll();return}
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()=='g'){e.preventDefault();groupSel();return}
  const ar={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[k];
  if(ar&&(sel!=null||msel.length)&&!pts.length){const L=selEnts();if(!L.length||L.some(x=>layerLock(x.layer)))return;e.preventDefault();const st=gridStep()*(e.shiftKey?10:1);snap0();L.forEach(x=>translate(x,ar[0]*st,ar[1]*st));attachOpenings();changed();return}
  const t=TOOLS.find(x=>x[3]==k.toUpperCase());if(t&&!e.ctrlKey)setTool(t[0])});
addEventListener('keyup',e=>{if(e.key=='Shift')shiftDown=false});

// ---------- Cotes modifiables (cliquer une cote → nouvelle valeur → tout s'ajuste) ----------
function dimAt(sp){for(let i=DIMHITS.length-1;i>=0;i--){const h=DIMHITS[i],dx=sp.x-h.p.x,dy=sp.y-h.p.y,c=Math.cos(-h.ang),s=Math.sin(-h.ang),lx=dx*c-dy*s,ly=dx*s+dy*c;
  if(Math.abs(lx)<h.w/2+5&&Math.abs(ly-h.off)<11)return h}return null}
function dimVal(m){const e=m.e;return m.k=='len'||m.k=='dim'?dist(e.a,e.b):m.k=='w'?Math.abs(e.b.x-e.a.x):m.k=='h'?Math.abs(e.b.y-e.a.y):e.r*2}
function stretch(a,b,newL){const A={...a},B={...b},L=dist(A,B)||1,ux=(B.x-A.x)/L,uy=(B.y-A.y)/L,dx=ux*(newL-L),dy=uy*(newL-L);
  const mv=q=>{if(q&&(q.x-A.x)*ux+(q.y-A.y)*uy>=L-0.5){q.x+=dx;q.y+=dy}};
  S.ents.forEach(e=>{if(layerLock(e.layer))return;['a','b','c','p','o'].forEach(k=>mv(e[k]));if(e.pts)e.pts.forEach(mv)})}
function applyDim(m,v){const e=m.e;
  if(m.k=='dim'||(m.k=='len'&&(e.type=='wall'||S.mode=='bat')))stretch(e.a,e.b,v);
  else if(m.k=='len'){const L=dist(e.a,e.b)||1,ob={...e.b},nb={x:e.a.x+(e.b.x-e.a.x)/L*v,y:e.a.y+(e.b.y-e.a.y)/L*v};S.ents.forEach(x=>{if(x===e)return;['a','b'].forEach(k=>{if(x[k]&&dist(x[k],ob)<.01){x[k].x=nb.x;x[k].y=nb.y}});if(x.pts)x.pts.forEach(q=>{if(dist(q,ob)<.01){q.x=nb.x;q.y=nb.y}})});e.b.x=nb.x;e.b.y=nb.y}
  else if(m.k=='w')e.b.x=e.a.x+Math.sign(e.b.x-e.a.x||1)*v;else if(m.k=='h')e.b.y=e.a.y+Math.sign(e.b.y-e.a.y||1)*v;else if(m.k=='d')e.r=v/2;
  attachOpenings()}
function openDimEd(h){closeDimEd();const sr=$('stage').getBoundingClientRect(),cr=cv.getBoundingClientRect(),inp=document.createElement('input');inp.id='dimEd';
  const cur=dimVal(h.meta);inp.value=S.unit=='mm'?String(Math.round(cur*10)/10):fmt(cur,1);
  inp.style.cssText=`position:absolute;z-index:30;left:${cr.left-sr.left+h.p.x-55}px;top:${cr.top-sr.top+h.p.y+h.off-14}px;width:110px;padding:4px 6px;font:600 14px system-ui;text-align:center;background:#0b2a55;color:#fff;border:2px solid #5ec4ff;border-radius:6px;box-shadow:0 4px 16px #000a`;
  inp.title='Nouvelle valeur (ex: 3600, 12\'6, 2.4m) puis Entrée · Échap pour annuler';$('stage').append(inp);inp.focus();inp.select();let done=false;
  const ok=()=>{if(done)return;done=true;const v=h.meta.k=='d'&&/^ø/i.test(inp.value)?parseLen(inp.value.slice(1)):parseLen(inp.value.replace(/^ø/i,''));closeDimEd();
    if(!(v>0)){alertBox('Valeur invalide');return}if(Math.abs(v-cur)<1e-6)return;snap0();applyDim(h.meta,v);sel=h.meta.e.id;changed();alertBox('📏 Cote modifiée : '+fmt(v)+' — le dessin s\'est ajusté')};
  inp.onkeydown=ev=>{ev.stopPropagation();if(ev.key=='Enter')ok();if(ev.key=='Escape'){done=true;closeDimEd()}};inp.onblur=ok}
function closeDimEd(){const x=$('dimEd');if(x)x.remove()}

// ---------- Menu clic droit ----------
const ENAME={wall:'Mur',line:'Ligne',rect:'Rectangle',circle:'Cercle',poly:'Polygone',room:'Pièce',door:'Porte',window:'Fenêtre',dim:'Cote',text:'Texte'};
function ctxMenu(ev,sp){const w=S2W(sp);if(pts.length){DGMenu.show(ev.clientX,ev.clientY,[{icon:'✔',label:'Terminer le tracé',key:'Entrée',action:finish},{icon:'✕',label:'Annuler le tracé',key:'Échap',action:()=>{pts=[];draw()}}]);return}
  const h=hit(w);if(h&&!isSel(h)){msel=[];sel=h.id;renderProps();draw()}
  const L=selEnts(),one=L.length==1?L[0]:null,g=L.length&&L[0].grp&&L.every(e=>e.grp==L[0].grp);
  const items=[];
  if(L.length){items.push({head:L.length>1?L.length+' éléments':(ENAME[one.type]||'Élément')+(one.name?' — '+one.name:'')},
    {icon:'🗑',label:L.length>1?'Supprimer les '+L.length+' éléments':'Supprimer',key:'Suppr',danger:true,action:deleteSel},
    {icon:'✂',label:'Couper',key:'Ctrl+X',action:()=>{if(copySel2())deleteSel()}},{icon:'📋',label:'Copier',key:'Ctrl+C',action:copySel2},{icon:'⧉',label:'Dupliquer',key:'Ctrl+D',action:()=>{if(copySel2())paste2(null)}});
    if(L.length>1&&!g)items.push({icon:'🧩',label:'Grouper',key:'Ctrl+G',action:groupSel});
    if(g)items.push({icon:'💥',label:'Dégrouper',action:()=>{snap0();L.forEach(e=>{delete e.grp;delete e.grpName});changed()}});
    if(S.layers.length>1)S.layers.filter(l=>l.id!=L[0].layer).forEach(l=>items.push({icon:'📑',label:'Envoyer vers « '+l.name+' »',action:()=>{snap0();L.forEach(e=>e.layer=l.id);msel=[];sel=null;changed()}}));
    if(one)items.push({icon:'⚙',label:'Propriétés',action:()=>{document.querySelector('#tabs [data-p=props]').click();const pp=WM.panels.side;if(pp.hidden||pp.min){pp.hidden=false;pp.min=false;WM.layout()}}});
    items.push('-')}

// ---------- Calcul des matériaux ----------
function openingsOf(w){return S.ents.filter(o=>(o.type=='door'||o.type=='window')&&segDist(o.p,w.a,w.b).d<w.t/2+5)}
function computeBat(){const c=S.cfg,items={};const addI=(k,lb,q,u)=>{if(!q)return;items[k]=items[k]||{lb,q:0,u};items[k].q+=q};
  let wallArea=0,wallLen=0;
  S.ents.filter(e=>e.type=='wall').forEach(w=>{const L=dist(w.a,w.b)/1000,H=w.h/1000,ops=openingsOf(w),opA=ops.reduce((s,o)=>s+o.w*o.h/1e6,0),A=Math.max(0,L*H-opA);wallLen+=L;wallArea+=A;
    if(w.mat=='ossature'){const sz=w.t<=110?'2x4':'2x6',studs=Math.ceil(L*1000/c.stud)+1+ops.length*4,plates=Math.ceil(L*3/2.44);
      addI('bois_'+sz,`Bois ${sz} 8 pi (montants+lisses)`,studs+plates,'pcs');addI('isolant','Isolant mural',A,'m²');addI('gypse','Gypse 4×8 (1220×2440)',A*c.faces*1.1/2.977,'feuilles');addI('peinture','Peinture (2 couches)',A*c.faces*2/10,'L')}
    else if(w.mat=='beton')addI('beton','Béton coulé',Math.max(0,L*H-opA)*w.t/1000,'m³');
    else if(w.mat=='bloc'){addI('bloc','Blocs béton 8×16 po',A/0.08*1.05,'blocs');addI('peinture','Peinture (2 couches)',A*c.faces*2/10,'L')}});
  let floorA=0;
  S.ents.filter(e=>e.type=='room').forEach(r=>{const A=polyArea(r.pts)/1e6,P=polyPerim(r.pts)/1000;floorA+=A;
    if(r.floor=='plancher'||!r.floor)addI('plancher','Plancher (+10 % perte)',A*1.1,'m²');
    if(r.floor=='ceramique')addI('ceramique','Céramique (+10 % perte)',A*1.1,'m²');
    if(r.floor=='beton')addI('beton','Béton coulé',A*0.1,'m³');
    const doorsW=S.ents.filter(d=>d.type=='door'&&r.pts.some((p,i)=>segDist(d.p,p,r.pts[(i+1)%r.pts.length]).d<300)).reduce((s,d)=>s+d.w/1000,0);
    addI('plinthe','Plinthes',Math.max(0,P-doorsW),'m');addI('gypse','Gypse 4×8 (1220×2440)',A*1.1/2.977,'feuilles');addI('peinture','Peinture (2 couches)',A*2/10,'L')});
  addI('porte','Portes',S.ents.filter(e=>e.type=='door').length,'pcs');addI('fenetre','Fenêtres',S.ents.filter(e=>e.type=='window').length,'pcs');
  ['gypse','bloc','bois_2x4','bois_2x6'].forEach(k=>items[k]&&(items[k].q=Math.ceil(items[k].q)));
  return{items,sum:[['Longueur de murs',(wallLen).toFixed(2)+' m'],['Surface murs nette',wallArea.toFixed(2)+' m²'],['Surface habitable',floorA.toFixed(2)+' m²'+(S.unit=='po'?` (${(floorA*10.7639).toFixed(0)} pi²)`:'')]]}}
function computeMec(){const parts=S.ents.filter(e=>isShape(e)&&e.role=='contour'),holes=S.ents.filter(e=>isShape(e)&&e.role=='trou');
  return parts.map((p,i)=>{const hs=holes.filter(h=>shapeContains(p,shapeCenter(h))),q=p.qty||1,mat=p.mat||S.cfg.metal,ep=p.ep??S.cfg.ep;
    const A=shapeArea(p)-hs.reduce((s,h)=>s+shapeArea(h),0),cut=shapePerim(p)+hs.reduce((s,h)=>s+shapePerim(h),0),V=A*ep,kg=V*1e-9*DENS[mat];
    const cost=kg*q*(S.kgprice[mat]||0)+cut/1000*q*(S.prices.coupe||0);
    return{name:p.name||'Pièce '+(i+1),id:p.id,mat,ep,q,A,cut,V,kg,holes:hs.length,cost,dia:hs.filter(h=>h.type=='circle').map(h=>h.r*2)}})}
function money(v){return v.toLocaleString('fr-CA',{style:'currency',currency:'CAD'})}
function renderMat(){const M=$('mat');let h='',rows=[];
  if(S.mode=='bat'){const {items,sum}=computeBat();h+='<h4>Résumé</h4><table>'+sum.map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]}</td></tr>`).join('')+'</table>';
    h+='<h4>Liste de matériaux</h4><table><tr><th>Article</th><th class="n">Qté</th><th class="n">Prix u.</th><th class="n">Total</th></tr>';let tot=0;
    Object.entries(items).forEach(([k,it])=>{const pr=S.prices[k]??0,t=pr*it.q;tot+=t;const q=Number.isInteger(it.q)?it.q:it.q.toFixed(2);rows.push([it.lb,q,it.u,pr,t.toFixed(2)]);
      h+=`<tr><td>${it.lb}</td><td class="n">${q} ${it.u}</td><td class="n"><input data-p="${k}" value="${pr}"></td><td class="n">${money(t)}</td></tr>`});
    h+=`</table><div class="tot">Total estimé : ${money(tot)}</div><p class="note">Ossature : montants aux ${fmt(S.cfg.stud)} c/c + 4 par ouverture, 3 lisses. Gypse sur ${S.cfg.faces} face(s) +10 %. Peinture 10 m²/L. Prix modifiables.</p>`;
    if(!Object.keys(items).length)h='<p class="note">Dessinez des murs (outil 🧱), des pièces (🟦), des portes et fenêtres pour obtenir la liste de matériaux.</p>'}
  else{const ps=computeMec();if(!ps.length){h='<p class="note">Dessinez un contour de pièce (rectangle, cercle ou polygone), puis des cercles à l\'intérieur pour les trous. La masse, la longueur de coupe et le coût sont calculés automatiquement.</p>'}
    let tot=0,tkg=0;ps.forEach(p=>{tot+=p.cost;tkg+=p.kg*p.q;rows.push([p.name,p.q,p.mat,p.ep,(p.kg).toFixed(3),p.cost.toFixed(2)]);
      h+=`<h4>${p.name} ×${p.q}</h4><table><tr><td>Matériau</td><td class="n">${p.mat} ép. ${fmt(p.ep,1)}</td></tr><tr><td>Surface nette</td><td class="n">${fmtA(p.A)}</td></tr>
      <tr><td>Volume</td><td class="n">${(p.V/1000).toFixed(2)} cm³</td></tr><tr><td>Masse unitaire</td><td class="n">${p.kg.toFixed(3)} kg</td></tr>
      <tr><td>Trous</td><td class="n">${p.holes}${p.dia.length?' ('+[...new Set(p.dia.map(d=>'Ø'+fmt(d)))].join(', ')+')':''}</td></tr>
      <tr><td>Longueur de coupe</td><td class="n">${fmt(p.cut)}</td></tr><tr><td>Coût (matière+coupe)</td><td class="n">${money(p.cost)}</td></tr></table>`});
    if(ps.length)h+=`<div class="tot">Masse totale : ${tkg.toFixed(3)} kg<br>Coût total : ${money(tot)}</div>`;
    h+='<h4>Prix matière ($/kg)</h4><table>'+Object.keys(DENS).map(k=>`<tr><td>${k} <span class="note">${DENS[k]} kg/m³</span></td><td class="n"><input data-k="${k}" value="${S.kgprice[k]}"></td></tr>`).join('')+`<tr><td>Coupe ($/m)</td><td class="n"><input data-p="coupe" value="${S.prices.coupe}"></td></tr></table>`}
  M.innerHTML=h;M._rows=rows;
  M.querySelectorAll('[data-p]').forEach(i=>i.onchange=()=>{S.prices[i.dataset.p]=parseFloat(i.value.replace(',','.'))||0;renderMat();save()});
  M.querySelectorAll('[data-k]').forEach(i=>i.onchange=()=>{S.kgprice[i.dataset.k]=parseFloat(i.value.replace(',','.'))||0;renderMat();save()})}

  const L=[`Mode : ${S.mode=='bat'?'bâtiment':'pièce mécanique'}. Unité affichée : ${S.unit}. Coordonnées en mm, X vers la droite, Y vers le HAUT, origine (0,0).`,
    `Éléments : ${Object.entries(c).map(([k,v])=>v+' '+(ENAME[k]||k)).join(', ')||'aucun'}.`+(b?` Emprise : X ${Math.round(b.x0)} à ${Math.round(b.x1)}, Y ${Math.round(-b.y1)} à ${Math.round(-b.y0)}.`:'')];
  S.ents.filter(e=>e.type=='room').forEach(r=>{const xs=r.pts.map(p=>p.x),ys=r.pts.map(p=>-p.y);L.push(`- pièce « ${r.name} » ${(polyArea(r.pts)/1e6).toFixed(2)} m², X ${Math.min(...xs)}..${Math.max(...xs)}, Y ${Math.min(...ys)}..${Math.max(...ys)}`)});
  S.ents.filter(e=>isShape(e)&&e.role=='contour').forEach(e=>L.push(`- contour ${e.type} ${e.name||''} ${fmtA(shapeArea(e))}`));return L.join('\n')}
const Pw=(x,y)=>({x:+x||0,y:-(+y||0)});
function addRectWalls(x,y,w,h,t){[[x,y,x+w,y],[x+w,y,x+w,y+h],[x+w,y+h,x,y+h],[x,y+h,x,y]].forEach(([a,b,c,d])=>add({type:'wall',a:Pw(a,b),b:Pw(c,d),t:t||S.cfg.wallT,h:S.cfg.wallH,mat:S.cfg.wallMat}))}
const AITOOLS=[
 {name:'ajouter_piece_rectangulaire',label:'Ajouter une pièce',description:'Bâtiment : ajoute une pièce rectangulaire (avec ses 4 murs). Coordonnées du coin bas-gauche en mm.',parameters:{type:'object',properties:{nom:{type:'string'},x_mm:{type:'number'},y_mm:{type:'number'},largeur_mm:{type:'number'},profondeur_mm:{type:'number'},avec_murs:{type:'boolean'},revetement:{type:'string',enum:['plancher','ceramique','beton','aucun']}},required:['largeur_mm','profondeur_mm']},
  run:a=>{if(S.mode!='bat')setMode('bat');snap0();const x=a.x_mm??0,y=a.y_mm??0,w=a.largeur_mm,h=a.profondeur_mm;if(a.avec_murs!==false)addRectWalls(x,y,w,h);
    add({type:'room',pts:[Pw(x,y),Pw(x+w,y),Pw(x+w,y+h),Pw(x,y+h)],name:a.nom||'Pièce',floor:a.revetement||'plancher'});linkFreeDims();changed();fit();return `« ${a.nom||'Pièce'} » ${(w*h/1e6).toFixed(2)} m² ajoutée`}},
 {name:'ajouter_mur',label:'Ajouter un mur',description:'Bâtiment : ajoute un mur droit entre deux points (mm).',parameters:{type:'object',properties:{x1_mm:{type:'number'},y1_mm:{type:'number'},x2_mm:{type:'number'},y2_mm:{type:'number'},epaisseur_mm:{type:'number'},materiau:{type:'string',enum:['ossature','beton','bloc']}},required:['x1_mm','y1_mm','x2_mm','y2_mm']},
  run:a=>{if(S.mode!='bat')setMode('bat');snap0();add({type:'wall',a:Pw(a.x1_mm,a.y1_mm),b:Pw(a.x2_mm,a.y2_mm),t:a.epaisseur_mm||S.cfg.wallT,h:S.cfg.wallH,mat:a.materiau||S.cfg.wallMat});changed();fit();return'mur ajouté'}},
 {name:'ajouter_porte_ou_fenetre',label:'Porte / fenêtre',description:'Place une porte ou une fenêtre sur le mur le plus proche du point (mm).',parameters:{type:'object',properties:{type:{type:'string',enum:['porte','fenetre']},x_mm:{type:'number'},y_mm:{type:'number'},largeur_mm:{type:'number'}},required:['type','x_mm','y_mm']},
  run:a=>{const p=Pw(a.x_mm,a.y_mm);let best=null,bd=1/0;S.ents.forEach(e=>{if(e.type!='wall')return;const r=segDist(p,e.a,e.b);if(r.d<bd){bd=r.d;best={e,t:r.t}}});if(!best)return'aucun mur';const e=best.e,tp=a.type=='porte'?'door':'window';snap0();
    add({type:tp,p:{x:e.a.x+(e.b.x-e.a.x)*best.t,y:e.a.y+(e.b.y-e.a.y)*best.t},ang:Math.atan2(e.b.y-e.a.y,e.b.x-e.a.x),t:e.t,w:a.largeur_mm||(tp=='door'?810:900),h:tp=='door'?2032:1200,flip:false});changed();return a.type+' ajoutée'}},
 {name:'creer_forme',label:'Créer une forme',description:'Pièce mécanique : crée un rectangle ou un cercle (contour de pièce ou trou). Position = centre en mm.',parameters:{type:'object',properties:{forme:{type:'string',enum:['rectangle','cercle']},x_mm:{type:'number'},y_mm:{type:'number'},largeur_mm:{type:'number'},hauteur_mm:{type:'number'},diametre_mm:{type:'number'},role:{type:'string',enum:['contour','trou']},materiau:{type:'string'},epaisseur_mm:{type:'number'}},required:['forme']},
  run:a=>{if(S.mode!='mec')setMode('mec');snap0();const c=Pw(a.x_mm,a.y_mm);let e;
    if(a.forme=='cercle')e=add({type:'circle',c,r:(a.diametre_mm||10)/2,role:a.role||defRole(c)});else{const w=a.largeur_mm||100,h=a.hauteur_mm||50;e=add({type:'rect',a:{x:c.x-w/2,y:c.y-h/2},b:{x:c.x+w/2,y:c.y+h/2},role:a.role||defRole(c)})}
    if(e.role=='contour'){e.mat=a.materiau||S.cfg.metal;e.ep=a.epaisseur_mm||S.cfg.ep}changed();fit();return a.forme+' ('+e.role+') créé'}},
 {name:'liste_materiaux',label:'Liste de matériaux',description:'Donne la liste de matériaux, quantités et coût estimé (ou masse et coût des pièces mécaniques).',parameters:{type:'object',properties:{}},
  run:()=>{if(S.mode=='bat'){const {items,sum}=computeBat();let t=0;const L=sum.map(s=>s.join(' : '));Object.entries(items).forEach(([k,it])=>{const pr=S.prices[k]??0;t+=pr*it.q;L.push(`${it.lb} : ${Number.isInteger(it.q)?it.q:it.q.toFixed(2)} ${it.u}`)});L.push('Total estimé : '+t.toFixed(2)+' $');return L.join('\n')}
    return computeMec().map(p=>`${p.name} ×${p.q} : ${p.mat} ép. ${p.ep} mm, ${p.kg.toFixed(3)} kg, ${p.holes} trous, coupe ${Math.round(p.cut)} mm, ${p.cost.toFixed(2)} $`).join('\n')||'aucune pièce'}},
 {name:'supprimer_selection',label:'Supprimer',description:'Supprime les éléments sélectionnés.',parameters:{type:'object',properties:{}},run:()=>{const n=selEnts().length;deleteSel();return n+' supprimé(s)'}},
 {name:'decrire_dessin',label:'Lire le dessin',description:'Décrit le dessin actuel (pièces, surfaces, emprise).',parameters:{type:'object',properties:{}},run:()=>drawingSummary()},
 {name:'annuler',label:'Annuler',description:'Annule la dernière action.',parameters:{type:'object',properties:{}},run:()=>{undo();return'annulé'}}];

// ---------- DXF (AutoCAD, Inventor, SolidWorks...) ----------
$('dxfB').onclick=()=>{const o=[];const P=(...a)=>o.push(...a);const Y=y=>-y;
  const line=(a,b,L)=>P(0,'LINE',8,L,10,a.x,20,Y(a.y),30,0,11,b.x,21,Y(b.y),31,0);
  const poly=(pts,L,closed=true)=>{P(0,'POLYLINE',8,L,66,1,70,closed?1:0,10,0,20,0,30,0);pts.forEach(p=>P(0,'VERTEX',8,L,10,p.x,20,Y(p.y),30,0));P(0,'SEQEND',8,L)};
  const text=(p,s,h,L,ang=0)=>P(0,'TEXT',8,L,10,p.x,20,Y(p.y),30,0,40,h,1,s,50,ang);
  const th=S.mode=='bat'?150:3;
  S.ents.forEach(e=>{switch(e.type){
    case'wall':{const L=dist(e.a,e.b)||1,nx=-(e.b.y-e.a.y)/L*e.t/2,ny=(e.b.x-e.a.x)/L*e.t/2;poly([{x:e.a.x+nx,y:e.a.y+ny},{x:e.b.x+nx,y:e.b.y+ny},{x:e.b.x-nx,y:e.b.y-ny},{x:e.a.x-nx,y:e.a.y-ny}],'MURS');break}
    case'line':line(e.a,e.b,'LIGNES');break;
    case'rect':poly(rectPts(e),e.role=='trou'?'TROUS':'CONTOURS');break;
    case'circle':P(0,'CIRCLE',8,e.role=='trou'?'TROUS':'CONTOURS',10,e.c.x,20,Y(e.c.y),30,0,40,e.r);break;
    case'poly':poly(e.pts,e.role=='trou'?'TROUS':'CONTOURS',e.closed!==false);break;
    case'room':poly(e.pts,'PIECES');text(centroid(e.pts),(e.name||'')+' '+fmtA(polyArea(e.pts)),th*2,'PIECES');break;
    case'door':case'window':{const c=Math.cos(e.ang),s=Math.sin(e.ang),hw=e.w/2,t=(e.t||150)/2,Q=(u,v)=>({x:e.p.x+c*u-s*v,y:e.p.y+s*u+c*v});poly([Q(-hw,-t),Q(hw,-t),Q(hw,t),Q(-hw,t)],e.type=='door'?'PORTES':'FENETRES');break}
    case'dim':{const L=dist(e.a,e.b)||1,ux=(e.b.x-e.a.x)/L,uy=(e.b.y-e.a.y)/L,nx=-uy,ny=ux,d=(e.o.x-e.a.x)*nx+(e.o.y-e.a.y)*ny,a2={x:e.a.x+nx*d,y:e.a.y+ny*d},b2={x:e.b.x+nx*d,y:e.b.y+ny*d};
      line(e.a,a2,'COTES');line(e.b,b2,'COTES');line(a2,b2,'COTES');text({x:(a2.x+b2.x)/2,y:(a2.y+b2.y)/2},fmt(L),th,'COTES',-Math.atan2(uy,ux)*180/Math.PI);break}
    case'text':text(e.p,e.s,e.size,'TEXTES');break}});
  const hdr=[0,'SECTION',2,'HEADER',9,'$ACADVER',1,'AC1009',9,'$INSUNITS',70,4,0,'ENDSEC',0,'SECTION',2,'ENTITIES'];
  const all=hdr.concat(o,[0,'ENDSEC',0,'EOF']);let s='';for(let i=0;i<all.length;i+=2)s+=all[i]+'\n'+all[i+1]+'\n';download('plan.dxf',s,'application/dxf')};
$('dxfI').onclick=()=>$('dxfF').click();
$('dxfF').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(txt=>{const L=txt.split(/\r?\n/),pr=[];for(let i=0;i+1<L.length;i+=2)pr.push([+L[i].trim(),L[i+1].trim()]);
  let i=pr.findIndex(p=>p[0]==2&&p[1]=='ENTITIES');if(i<0){alert('DXF sans section ENTITIES');return}
  let scale=1;const iu=txt.match(/\$INSUNITS\s*\r?\n\s*70\s*\r?\n\s*(\d+)/);if(iu)scale={1:25.4,2:304.8,4:1,5:10,6:1000}[iu[1]]||1;
  const out=[];let cur=null,poly=null;const P=(x,y)=>({x:x*scale,y:-y*scale});
  const flush=()=>{if(!cur)return;const g=cur.g,n=k=>+(g[k]||[0])[0];
    if(cur.t=='LINE')out.push({type:'line',a:P(n(10),n(20)),b:P(n(11),n(21))});
    else if(cur.t=='CIRCLE')out.push({type:'circle',c:P(n(10),n(20)),r:n(40)*scale});
    else if(cur.t=='ARC'){const c={x:n(10),y:n(20)},r=n(40);let a0=n(50),a1=n(51);if(a1<a0)a1+=360;const pts=[];for(let k=0;k<=24;k++){const a=(a0+(a1-a0)*k/24)*Math.PI/180;pts.push(P(c.x+r*Math.cos(a),c.y+r*Math.sin(a)))}out.push({type:'poly',pts,closed:false})}
    else if(cur.t=='LWPOLYLINE'){const xs=g[10]||[],ys=g[20]||[];out.push({type:'poly',pts:xs.map((x,k)=>P(+x,+ys[k])),closed:(n(70)&1)==1})}
    else if(cur.t=='TEXT'||cur.t=='MTEXT')out.push({type:'text',p:P(n(10),n(20)),s:(g[1]||[''])[0].replace(/\\P/g,' '),size:n(40)*scale||100});
    cur=null};
  for(i++;i<pr.length;i++){const [c,v]=pr[i];
    if(c==0){flush();if(v=='ENDSEC')break;
      if(v=='POLYLINE'){poly={pts:[],closed:false,f:true};continue}
      if(v=='VERTEX'&&poly){cur={t:'VERTEX',g:{}};continue}
      if(v=='SEQEND'&&poly){if(poly.pts.length>1)out.push({type:'poly',pts:poly.pts,closed:poly.closed});poly=null;continue}
      cur={t:v,g:{}};continue}
    if(poly&&cur&&cur.t=='VERTEX'){if(c==10)cur.x=+v;if(c==20){poly.pts.push(P(cur.x,+v))}continue}
    if(poly&&!cur){if(c==70)poly.closed=(+v&1)==1;continue}
    if(cur)(cur.g[c]=cur.g[c]||[]).push(v)}
  flush();if(!out.length){alert('Aucune entité reconnue (LINE, CIRCLE, ARC, POLYLINE, LWPOLYLINE, TEXT)');return}
  snap0();const sh=out.filter(o=>o.type=='circle'||o.type=='poly'&&o.closed).sort((a,b)=>shapeArea(b)-shapeArea(a));
  out.forEach(o=>{if(o.type=='poly'&&o.pts.length<2)return;if(!isShape(o)||o.type=='poly'&&!o.closed)o.role='trait';add(o)});
  sh.forEach(o=>o.role=defRole(shapeCenter(o)));sel=null;changed();fit();alertBox('📥 '+out.length+' entités importées')});e.target.value=''};

$('delSel').onclick=deleteSel;
$('undo').onclick=undo;$('redo').onclick=redo;$('fit').onclick=fit;
function toggle(k){S.cfg[k]=!S.cfg[k];$(k=='snap'?'snapB':'ortho').classList.toggle('on',S.cfg[k]);save()}

  'Menu Fichier (Nouveau, Ouvrir, Enregistrer, exporter)':'.dgmb','Annuler':'#undo','Rétablir':'#redo','Supprimer':'#delSel','Ortho':'#ortho','Aimant':'#snapB','Ajuster la vue':'#fit','Passer en 3D':'a[href="modele3d.html"] button','Mode bâtiment / pièce':'#mode','Unités':'#unit',
  'Calques':'#ltabs','Ajouter un calque':()=>[...document.querySelectorAll('#ltabs .tb')].find(x=>/Calque/.test(x.textContent)&&/＋/.test(x.textContent)),'Propriétés':tabB('props'),'Matériaux et coûts':tabB('mat'),'Réglages':tabB('cfg'),'Bibliothèque':'.dglib'});
const WM=DGPanels.init('2d',$('main'),$('stage'),[{id:'tools',title:'Outils',el:$('tools'),dock:'left',w:64},{id:'side',title:'Propriétés',el:$('side'),dock:'right',w:300,weight:1.7},{id:'lib',title:'📚 Bibliothèque',el:libBox,dock:'right',w:300,weight:1},{id:'lia',title:'👩 Lia — votre assistante',el:aiBox,dock:'float',x:Math.max(80,innerWidth-310-360),y:Math.max(60,innerHeight-Math.min(470,innerHeight-110)-12),w:350,h:Math.min(470,innerHeight-110)}]);
DGMenu.group('📁 Fichier ▾','Nouveau, ouvrir, enregistrer, exporter',['newB','openB','saveB','-','photoB','pngB','dxfB','dxfI','csvB','printB'],$('tbEnd'));
const plusB=DGMenu.group('⋯ Plus ▾','Autres commandes',['to3dB','winB','panelB'],$('tbEnd'));
$('winB').onclick=()=>WM.menu(plusB);$('aiB').onclick=()=>{const p=WM.panels.lia;if(p.hidden||p.min){p.hidden=false;p.min=false;WM.layout();DGAssist.focus()}else{p.min=true;WM.layout()}};$('panelB').onclick=()=>WM.toggleDock('right');

if(!S.ents.length)exampleHouse();else fit();renderProps();
